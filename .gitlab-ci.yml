# Monorepo CI, gated by folder group - a push only runs the CI for the group
# that changed:
#
#   applications/  -> apps-test (flutter analyze/test + vrhome make test)
#   websites/      -> website-test, docs-build, pages
#   system/dist/   -> manual pipelines only, never runs on a git push
#   anything else  -> no pipeline at all (root files, dumps/, research/, ...)
#
# The dist lane: "Run pipeline" (web/api) pushes HEAD to the GitHub mirror,
# dispatches the image build there, and pulls the release back through the
# package registry.
#
# Secrets only exist as protected CI variables and GitHub secrets - forked MR
# pipelines get neither.

default:
  tags:
    - linux-truenas

stages:
  - test
  - build
  - release
  - deploy

# Folder groups. Job rules reference these; the workflow rules below use the
# combined list so pushes outside CI'd folders never even create a pipeline.
.apps-paths: &apps-paths
  - "applications/**/*"

.web-paths: &web-paths
  - "websites/**/*"

.ci-paths: &ci-paths
  - "applications/**/*"
  - "websites/**/*"

workflow:
  rules:
    # manual pipelines are how dist builds run - always allowed
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # MRs only when a CI'd folder changed
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ci-paths
    # pushes to main only when a CI'd folder changed - root README and
    # friends just land quietly
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ci-paths

# Default to alpha so test runs don't pollute the release/beta channels.
# Override CHANNEL when running a pipeline manually to "release" or "beta".
variables:
  CHANNEL: "alpha"

# ------------------------------------------------------- dist (manual) -----

github-dispatch:
  stage: build
  image: alpine:3.20
  timeout: 4h
  # Full clone - pushing a shallow history to the mirror fails on the pack
  # negotiation ("did not receive expected object").
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - CHANNEL="${CHANNEL:-release}" bash system/dist/scripts/trigger-github-build.sh main HEAD

github-release-sync:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash system/dist/scripts/sync-from-github.sh

# -------------------------------------------------------------- apps -------

apps-test:
  stage: test
  # No pinned cirruslabs image is new enough (pn2_library wants Dart
  # ^3.12.2 -> Flutter 3.44.6+). Keep the tarball version in sync with
  # FLUTTER_VERSION in system/dist/manifest.env.
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl git xz-utils unzip zip file make g++ ca-certificates libglu1-mesa
    - curl -fsSL -o /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.6-stable.tar.xz"
    - tar -xJf /tmp/flutter.tar.xz -C /opt
    - export PATH="/opt/flutter/bin:$PATH"
    - git config --global --add safe.directory /opt/flutter
    - flutter config --no-analytics
    - flutter --version
  script:
    - export PATH="/opt/flutter/bin:$PATH"
    - |
      for d in applications/*/; do
        if [ -f "$d/pubspec.yaml" ]; then
          (cd "$d" && flutter pub get && flutter analyze && flutter test) || exit 1
        fi
      done
    - make -C applications/vrhome test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *apps-paths
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *apps-paths

# -------------------------------------------------------------- websites ---

website-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  script:
    - cd websites/website
    - flutter pub get
    - flutter analyze
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - websites/website/**/*
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - websites/website/**/*

# docs build in their own image (the flutter image has no pip) and ship as an
# artifact - the pages job drops them into public/docs/ so the site is one
# deployment: app at /, docs at /docs/.
docs-build:
  stage: deploy
  image: python:3.12
  before_script:
    - pip install mkdocs-material
  script:
    - cd websites/docs
    - mkdocs build --strict -d "$CI_PROJECT_DIR/docs-public"
  artifacts:
    paths:
      - docs-public
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: ghcr.io/cirruslabs/flutter:3.44.0
  needs: ["docs-build"]
  script:
    - cd websites/website
    - flutter pub get
    - flutter build web --release --no-web-resources-cdn --base-href "/"
    - cp -r build/web "$CI_PROJECT_DIR/public"
    - mkdir -p "$CI_PROJECT_DIR/public/docs"
    - cp -r "$CI_PROJECT_DIR/docs-public/." "$CI_PROJECT_DIR/public/docs/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *web-paths
