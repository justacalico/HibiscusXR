# Monorepo CI. Three lanes:
#   dist bridge  - pushes main/tags to the GitHub mirror; manual pipelines
#                  dispatch the real image build there and pull the release
#                  back through the package registry
#   app tests    - flutter analyze/test when websites/website changes
#   pages        - websites/website deploys the project site, websites/docs
#                  deploys under the /docs path prefix
#
# Secrets only exist as protected CI variables and GitHub secrets. Protected
# variables are only exposed on protected refs, so forked MR pipelines can't
# reach them or the signing material inside the private inputs registry.
default:
  tags:
    - linux-truenas

stages:
  - test
  - sync
  - build
  - release
  - deploy

# Default to alpha so test runs don't pollute the release/beta channels.
# Override CHANNEL when running a pipeline manually (web UI "Run pipeline"
# -> Variables) to "release" or "beta" for a proper release.
variables:
  CHANNEL: "alpha"

# ------------------------------------------------------------------ dist ---

github-sync:
  stage: sync
  image: alpine:3.20
  # Full clone - pushing a shallow history to the empty mirror fails on the
  # pack negotiation ("did not receive expected object").
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:justacalico/HibiscusXR.git || true
    - git remote update github
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push -f github "$CI_COMMIT_TAG"
      else
        git push github HEAD:refs/heads/main
      fi

github-dispatch:
  stage: build
  image: alpine:3.20
  timeout: 4h
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - CHANNEL="${CHANNEL:-release}" bash system/dist/scripts/trigger-github-build.sh main HEAD

github-release-sync:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash system/dist/scripts/sync-from-github.sh

# -------------------------------------------------------------- website ----

website-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  script:
    - cd websites/website
    - flutter pub get
    - flutter analyze
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - websites/website/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - websites/website/**/*

# docs build in their own image (the flutter image has no pip) and ship as
# an artifact - the pages job drops them into public/docs/ so the site has
# one deployment: app at /, docs at /docs/.
docs-build:
  stage: deploy
  image: python:3.12
  before_script:
    - pip install mkdocs-material
  script:
    - cd websites/docs
    - mkdocs build --strict -d "$CI_PROJECT_DIR/docs-public"
  artifacts:
    paths:
      - docs-public
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  image: ghcr.io/cirruslabs/flutter:3.44.0
  needs: ["docs-build"]
  script:
    - cd websites/website
    - flutter pub get
    - flutter build web --release --no-web-resources-cdn --base-href "/"
    - cp -r build/web "$CI_PROJECT_DIR/public"
    - mkdir -p "$CI_PROJECT_DIR/public/docs"
    - cp -r "$CI_PROJECT_DIR/docs-public/." "$CI_PROJECT_DIR/public/docs/"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - websites/website/**/*
        - websites/docs/**/*
