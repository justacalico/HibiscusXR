# Monorepo CI, gated by folder group - a push only runs the CI for the group
# that changed, plus the os-changelog housekeeping job which always runs:
#
#   applications/  -> apps-test (flutter analyze/test + vrhome make test)
#   websites/      -> website-test, pages
#   system/dist/   -> manual pipelines only, never runs on a git push
#   every push     -> os-changelog (refreshes CHANGELOG.md Unreleased)
#
# The dist lane: "Run pipeline" (web/api) pushes main to the GitHub mirror,
# dispatches the image build there, and pulls the release back through the
# package registry. With CHANNEL=release it also versions the OS first:
# os-bump writes the changelog from merged MRs (never commits), cuts the
# os-v* tag and pushes both back; the build then stamps and releases that
# tag. os-changelog is the only cog job allowed to run unattended - it
# refreshes the Unreleased block on main pushes.
#
# Secrets only exist as protected CI variables and GitHub secrets - forked MR
# pipelines get neither.

default:
  tags:
    - linux-truenas

stages:
  - test
  - build
  - release
  - deploy

# Folder groups. Job rules reference these; the workflow rules below use the
# combined list so pushes outside CI'd folders never even create a pipeline.
.apps-paths: &apps-paths
  - "applications/**/*"

.web-paths: &web-paths
  - "websites/**/*"

.ci-paths: &ci-paths
  - "applications/**/*"
  - "websites/**/*"

workflow:
  rules:
    # cte-v* / hbsup-v* tag pushes run the app release lanes
    - if: $CI_COMMIT_TAG =~ /^cte-v/
    - if: $CI_COMMIT_TAG =~ /^hbsup-v/
    # manual pipelines are how dist builds run - always allowed
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    # MRs only when a CI'd folder changed
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ci-paths
    # every push to main gets a pipeline: the os-changelog cog job has to
    # see merges outside the CI'd folders too. It is the only ungated job,
    # so pushes that touch nothing CI'd still stay cheap
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Default to alpha so test runs don't pollute the release/beta channels.
# Override CHANNEL when running a pipeline manually to "release" or "beta".
variables:
  CHANNEL: "alpha"

# ------------------------------------------------------- dist (manual) -----

# Manual-only version bump. A CHANNEL=release dist pipeline first lands
# this job: it writes the MR-based changelog section, tags main os-v*,
# pushes both back, and hands the tag to github-dispatch via the dotenv
# artifact. Anything else (alpha/beta, non-dist pipelines) never bumps -
# the image keeps the date-run tag.
os-bump:
  stage: build
  image: alpine:3.20
  resource_group: os-release
  timeout: 15m
  rules:
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger") && $CHANNEL == "release" && $RELEASE_TAG !~ /^(cte|hbsup)-/
  variables:
    COCOGITTO_VERSION: "7.0.0"
    GLAB_VERSION: "1.113.0"
  artifacts:
    reports:
      dotenv: os-release.env
  before_script:
    - apk add --no-cache bash curl git openssh-client python3
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
    - git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
  script:
    - bash system/dist/scripts/os-bump.sh

github-dispatch:
  stage: build
  image: alpine:3.20
  timeout: 4h
  # Full clone - pushing a shallow history to the mirror fails on the pack
  # negotiation ("did not receive expected object").
  variables:
    GIT_DEPTH: "0"
  needs:
    # when os-bump ran this waits for it and picks up os-release.env;
    # on alpha/beta runs the job does not exist and this starts at once
    - job: os-bump
      optional: true
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    # cte tag triggers carry RELEASE_TAG=cte-v* - not for the dist lane
    - if: $CI_PIPELINE_SOURCE == "api" && $RELEASE_TAG !~ /^(cte|hbsup)-/
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_TAG !~ /^(cte|hbsup)-/
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    # ship main's tip, not the pipeline sha: a release run builds the
    # tree os-bump just pushed (same content plus the changelog commit)
    - git fetch origin main "+refs/tags/*:refs/tags/*"
    - CHANNEL="${CHANNEL:-release}" RELEASE_VERSION="${OS_TAG:-}" bash system/dist/scripts/trigger-github-build.sh main FETCH_HEAD

github-release-sync:
  stage: release
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api" && $RELEASE_TAG !~ /^(cte|hbsup)-/
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_TAG !~ /^(cte|hbsup)-/
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash system/dist/scripts/sync-from-github.sh

# The one automatic cog job: every push to main refreshes the Unreleased
# block of CHANGELOG.md from the MRs merged since the last os-v* tag.
# Commits back only when something changed, with ci.skip - version bumps
# and releases never run unattended.
os-changelog:
  stage: test
  image: alpine:3.20
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GLAB_VERSION: "1.113.0"
  before_script:
    - apk add --no-cache bash curl git openssh-client python3
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
    - git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
  script:
    - bash system/dist/scripts/update-os-changelog.sh

# -------------------------------------------------------------- apps -------

apps-test:
  stage: test
  # No pinned cirruslabs image is new enough (the apps want Dart
  # ^3.12.2 -> Flutter 3.44.6+). Keep the tarball version in sync with
  # FLUTTER_VERSION in system/dist/manifest.env.
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl git xz-utils unzip zip file make g++ ca-certificates libglu1-mesa zlib1g-dev
    - curl -fsSL -o /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.6-stable.tar.xz"
    - tar -xJf /tmp/flutter.tar.xz -C /opt
    - export PATH="/opt/flutter/bin:$PATH"
    - git config --global --add safe.directory /opt/flutter
    - flutter config --no-analytics
    - flutter --version
  script:
    - export PATH="/opt/flutter/bin:$PATH"
    - |
      for d in applications/*/ applications/*/*/; do
        if [ -f "$d/pubspec.yaml" ]; then
          (cd "$d" && flutter pub get && flutter analyze && flutter test) || exit 1
        fi
      done
    - make -C applications/vrhome test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *apps-paths
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *apps-paths

# -------------------------------------------------------------- websites ---

website-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.44.0
  script:
    - cd websites/website
    - flutter pub get
    - flutter analyze
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - websites/website/**/*
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - websites/website/**/*

pages:
  stage: deploy
  image: ghcr.io/cirruslabs/flutter:3.44.0
  script:
    - cd websites/website
    - flutter pub get
    - flutter build web --release --no-web-resources-cdn --base-href "/"
    - cp -r build/web "$CI_PROJECT_DIR/public"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *web-paths

# ------------------------------------------------------------- cte app ----

# Every main push that touched the app: cog decides if the conventional
# commits under applications/desktop/cte warrant a cte-v* tag. The bump commit
# goes back via the hcte-release deploy key (writes to protected main);
# its push carries ci.skip, the tag push then starts the release lane.
cte-bump:
  stage: release
  image: alpine:3.20
  resource_group: cte-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "applications/desktop/cte/**/*"
        - "cog.toml"
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
    - git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
  script:
    - bash applications/desktop/cte/ci/bump-cte.sh

# A cte-v* tag: mirror it to GitHub and watch the cte.yml release run.
cte-release:
  stage: release
  image: alpine:3.20
  timeout: 3h
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^cte-v/
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - bash applications/desktop/cte/ci/trigger-cte-release.sh "$CI_COMMIT_TAG"

# Fired by the GitHub release via the pipeline trigger token: pulls the
# release assets back into a GitLab release so the binaries never expire.
cte-release-sync:
  stage: release
  image: alpine:3.20
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_TAG =~ /^cte-v/
    - if: $CI_PIPELINE_SOURCE == "api" && $RELEASE_TAG =~ /^cte-v/
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash applications/desktop/cte/ci/sync-cte-release.sh

# ------------------------------------------------------------- hbsup app ---

# Same lane shape as cte: cog bumps on hbsup changes, the tag push
# triggers the GitHub release build, the trigger pipeline syncs assets
# back into a GitLab release.
hbsup-bump:
  stage: release
  image: alpine:3.20
  resource_group: hbsup-release
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "applications/desktop/hbsup/**/*"
        - "cog.toml"
  variables:
    COCOGITTO_VERSION: "7.0.0"
  before_script:
    - apk add --no-cache bash curl git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITLAB_RELEASE_SSH_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 gitlab.com > ~/.ssh/known_hosts
    - git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
    - curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/${COCOGITTO_VERSION}/cocogitto-${COCOGITTO_VERSION}-x86_64-unknown-linux-musl.tar.gz"
    - mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
    - install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.com"
  script:
    - bash applications/desktop/hbsup/ci/bump-hbsup.sh

hbsup-release:
  stage: release
  image: alpine:3.20
  timeout: 3h
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^hbsup-v/
  before_script:
    - apk add --no-cache bash curl jq git github-cli openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$GITHUB_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - echo "" >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts
  script:
    - bash applications/desktop/hbsup/ci/trigger-hbsup-release.sh "$CI_COMMIT_TAG"

hbsup-release-sync:
  stage: release
  image: alpine:3.20
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
    GLAB_VERSION: "1.113.0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $RELEASE_TAG =~ /^hbsup-v/
    - if: $CI_PIPELINE_SOURCE == "api" && $RELEASE_TAG =~ /^hbsup-v/
  before_script:
    - apk add --no-cache bash curl jq git github-cli
    - bash system/dist/scripts/install-glab.sh
    - |
      if [ -n "${CI_SERVER_FQDN:-}" ]; then
        glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "https" --insecure-storage || true
      fi
  script:
    - bash applications/desktop/hbsup/ci/sync-hbsup-release.sh
