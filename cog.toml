# Monorepo versioning: the desktop apps are cog-versioned; the OS images
# version by date+run (system/dist). Package tags come out as
# cte-v0.1.0 / hbsup-v0.1.0 - the matching GitLab tag pipelines and the
# GitHub release workflows key off those prefixes.
monorepo_version_separator = "-v"

[monorepo.packages.cte]
path = "applications/desktop/cte"
pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]

# Hook profile the cte-bump CI job uses.
[monorepo.packages.cte.bump_profiles.ci]
pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]


[monorepo.packages.hbsup]
path = "applications/desktop/hbsup"
pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]

# Hook profile the hbsup-bump CI job uses.
[monorepo.packages.hbsup.bump_profiles.ci]
pre_bump_hooks = [
  "sed -i -E 's/^version:.*/version: {{version}}/' pubspec.yaml",
]

# OS image versioning. The tag (os-v*) is cut inside the manual dist
# pipeline by system/dist/scripts/os-bump.sh - pushes to main never bump
# on their own. The changelog is generated from merge requests by
# system/dist/scripts/os_changelog.py, not from commits, so a 20-commit
# MR is still one entry. include=["**"] makes every commit count as in
# scope for the package; without it a release with no system/ commit
# errors out inside cog's changelog pass, which we run but discard.
[monorepo.packages.os]
path = "system"
include = ["**"]
