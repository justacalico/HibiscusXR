default:
  image: ghcr.io/cirruslabs/flutter:3.44.0
  tags:
    - linux-truenas

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - flutter pub get
    - flutter analyze
    - flutter test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - flutter pub get
    - flutter build web --release --no-web-resources-cdn --base-href "/"
    - cp -r build/web public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
