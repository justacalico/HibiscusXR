<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PN2Lineage - LineageOS 17.1 running on the Pico Neo 2 VR headset.">
  <meta name="theme-color" content="#fbfbfd">
  <meta name="color-scheme" content="light dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="PN2Lineage">
  <meta property="og:description" content="LineageOS 17.1 on the Pico Neo 2 - vendor untouched, VR stack restored, all research in the open.">
  <meta property="og:image" content="og-cover.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PN2Lineage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PN2Lineage</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fbfbfd;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
    }
    @media (prefers-color-scheme: dark) {
      #loader { background: #000; }
      #loader span { color: #f5f5f7; }
    }
    #loader span {
      color: #1d1d1f;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      animation: breathe 1.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loader span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loader"><span>PN2Lineage</span></div>
  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:sans-serif;">
      This site needs JavaScript - it is built with Flutter web.
    </div>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loader');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
